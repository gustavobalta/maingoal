<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      padding: 24px 20px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #111;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }

    .btn {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      color: #333;
      transition: background 0.1s;
    }
    .btn:hover { background: #eee; }
    .btn.primary {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }
    .btn.primary:hover { background: #1558b0; }

    .search-input {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      width: 200px;
      outline: none;
    }
    .search-input:focus { border-color: #1a73e8; }

    .filter-sel {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    thead th {
      background: #f0f0f0;
      border-bottom: 1px solid #d0d0d0;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: #444;
      user-select: none;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #e8e8e8;
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9f9f9; }

    td {
      padding: 7px 12px;
      vertical-align: middle;
    }

    td input[type="text"],
    td input[type="number"] {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      color: #111;
      outline: none;
      padding: 2px 0;
    }
    td input[type="text"]:focus,
    td input[type="number"]:focus {
      background: #fff9e6;
      border-radius: 3px;
      padding: 2px 4px;
    }

    td.col-dias input { width: 56px; text-align: center; }
    td.col-empresa { min-width: 100px; }
    td.col-funcional { min-width: 120px; }
    td.col-dias { width: 70px; }
    td.col-status { width: 140px; }
    td.col-actions { width: 40px; text-align: center; }

    /* Status dropdown */
    .status-sel {
      border: none;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
      width: 100%;
      min-width: 110px;
    }

    .s-iniciar  { background: #fff;    color: #555;  border: 1px solid #ccc; }
    .s-iniciado { background: #e0e0e0; color: #333;  border: 1px solid #bbb; }
    .s-testes   { background: #fff9c4; color: #7a6000; border: 1px solid #e0c800; }
    .s-pronto   { background: #c8e6c9; color: #1b5e20; border: 1px solid #81c784; }
    .s-lancado  { background: #bbdefb; color: #0d3c70; border: 1px solid #64b5f6; }
    .s-parado   { background: #ffcdd2; color: #7f0000; border: 1px solid #ef9a9a; }

    /* Delete btn */
    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 15px;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
      transition: color 0.1s, background 0.1s;
    }
    .del-btn:hover { color: #d32f2f; background: #ffebee; }

    /* Add row */
    .add-row td { padding: 6px 12px; }
    .add-row input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fafafa;
      outline: none;
    }
    .add-row input:focus { border-color: #1a73e8; background: #fff; }
    .add-row td.col-dias input { width: 56px; text-align: center; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #333; color: #fff; font-size: 12px;
      padding: 7px 16px; border-radius: 16px; opacity: 0;
      transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .count-label {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

<h1>Tracker de Atividades</h1>

<div class="toolbar">
  <button class="btn primary" onclick="addRow()">+ Adicionar linha</button>
  <input class="search-input" id="search" placeholder="Buscar..." oninput="render()" />
  <select class="filter-sel" id="filter-status" onchange="render()">
    <option value="">Todos os status</option>
    <option value="iniciar">A iniciar</option>
    <option value="iniciado">Iniciado</option>
    <option value="testes">Testes</option>
    <option value="pronto">Pronto</option>
    <option value="lancado">Lançado</option>
    <option value="parado">Parado</option>
  </select>
  <span class="count-label" id="count-label"></span>
  <button class="btn" onclick="exportCSV()" style="margin-left:8px;">↓ CSV</button>
</div>

<div class="table-wrap">
  <table id="main-table">
    <thead>
      <tr>
        <th class="col-empresa">Empresa</th>
        <th class="col-funcional">Funcional</th>
        <th class="col-dias">Dias</th>
        <th class="col-status">Status</th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
  const STATUS = [
    { val: 'iniciar',  label: 'A iniciar',  cls: 's-iniciar'  },
    { val: 'iniciado', label: 'Iniciado',   cls: 's-iniciado' },
    { val: 'testes',   label: 'Testes',     cls: 's-testes'   },
    { val: 'pronto',   label: 'Pronto',     cls: 's-pronto'   },
    { val: 'lancado',  label: 'Lançado',    cls: 's-lancado'  },
    { val: 'parado',   label: 'Parado',     cls: 's-parado'   },
  ];

  function statusCls(val) {
    const s = STATUS.find(s => s.val === val);
    return s ? s.cls : 's-iniciar';
  }

  let rows = [];
  try { rows = JSON.parse(localStorage.getItem('tracker_xl') || '[]'); } catch(e) {}

  function save() {
    try { localStorage.setItem('tracker_xl', JSON.stringify(rows)); } catch(e) {}
  }

  function uid() { return Date.now() + Math.random().toString(36).slice(2); }

  function addRow() {
    rows.unshift({ id: uid(), empresa: '', funcional: '', dias: '', status: 'iniciar' });
    save();
    render();
    // focus first input of new row
    setTimeout(() => {
      const first = document.querySelector('#tbody tr:first-child td.col-empresa input');
      if (first) first.focus();
    }, 30);
  }

  function deleteRow(id) {
    rows = rows.filter(r => r.id !== id);
    save();
    render();
    toast('Linha removida');
  }

  function updateField(id, field, value) {
    const row = rows.find(r => r.id === id);
    if (!row) return;
    row[field] = value;
    save();
  }

  function updateStatus(id, value) {
    const row = rows.find(r => r.id === id);
    if (!row) return;
    row.status = value;
    save();
    // update select styling without full re-render
    const sel = document.querySelector(`select[data-id="${id}"]`);
    if (sel) {
      sel.className = 'status-sel ' + statusCls(value);
    }
  }

  function render() {
    const q  = document.getElementById('search').value.toLowerCase();
    const sf = document.getElementById('filter-status').value;

    const filtered = rows.filter(r => {
      const hay = [r.empresa, r.funcional, r.dias].join(' ').toLowerCase();
      return (!q || hay.includes(q)) && (!sf || r.status === sf);
    });

    document.getElementById('count-label').textContent =
      filtered.length + ' linha' + (filtered.length !== 1 ? 's' : '');

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = filtered.map(r => {
      const cls = statusCls(r.status);
      const opts = STATUS.map(s =>
        `<option value="${s.val}"${r.status === s.val ? ' selected' : ''}>${s.label}</option>`
      ).join('');
      return `<tr data-id="${r.id}">
        <td class="col-empresa"><input type="text" value="${esc(r.empresa)}" placeholder="Empresa"
          onchange="updateField('${r.id}','empresa',this.value)"
          onblur="updateField('${r.id}','empresa',this.value)" /></td>
        <td class="col-funcional"><input type="text" value="${esc(r.funcional)}" placeholder="Funcional"
          onchange="updateField('${r.id}','funcional',this.value)"
          onblur="updateField('${r.id}','funcional',this.value)" /></td>
        <td class="col-dias"><input type="text" value="${esc(r.dias)}" placeholder="0"
          onchange="updateField('${r.id}','dias',this.value)"
          onblur="updateField('${r.id}','dias',this.value)" /></td>
        <td class="col-status">
          <select class="status-sel ${cls}" data-id="${r.id}" onchange="updateStatus('${r.id}',this.value)">
            ${opts}
          </select>
        </td>
        <td class="col-actions">
          <button class="del-btn" onclick="deleteRow('${r.id}')" title="Remover">✕</button>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="5" style="text-align:center;padding:24px;color:#aaa;">
        Nenhuma linha. Clique em "+ Adicionar linha" para começar.
      </td></tr>`;
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  function exportCSV() {
    if (!rows.length) { toast('Nada para exportar'); return; }
    const header = ['Empresa','Funcional','Dias','Status'];
    const data = rows.map(r => [
      r.empresa, r.funcional, r.dias,
      STATUS.find(s => s.val === r.status)?.label || r.status
    ]);
    const csv = [header, ...data]
      .map(row => row.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(','))
      .join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tracker.csv';
    a.click();
    toast('CSV exportado');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  // keyboard: Enter on a row moves to next row same column, Tab works natively
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const input = e.target;
    if (!input.matches('td input')) return;
    e.preventDefault();
    const td = input.closest('td');
    const tr = td.closest('tr');
    const nextTr = tr.nextElementSibling;
    if (nextTr) {
      const idx = Array.from(tr.children).indexOf(td);
      const nextInput = nextTr.children[idx]?.querySelector('input');
      if (nextInput) nextInput.focus();
    }
  });

  render();
</script>
</body>
</html>
